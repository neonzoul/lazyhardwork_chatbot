# CI is a release gate, not a test machine: run `npm test` and `npm run scenarios` locally first.
name: test
on:
  push:
    branches: [v2, main]
  pull_request:
    branches: [v2, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run scenarios
