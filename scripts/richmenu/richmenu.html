<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Lay v2 Rich Menu — default</title>
<link rel="stylesheet" href="richmenu.css">
</head>
<body>
<div class="menu">

  <div class="tile" data-tile="capability">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
      <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
    </svg></div>
    <div class="label">ทำอะไรได้บ้าง</div>
    <div class="hint">6 เรื่องที่คนถามบ่อย</div>
  </div>

  <div class="tile" data-tile="fit">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M8.5 12.2l2.4 2.4 4.8-5.2"/>
    </svg></div>
    <div class="label">เหมาะกับงานผมไหม</div>
    <div class="hint">เลือกอาการของร้าน</div>
  </div>

  <div class="tile" data-tile="examples">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>
    </svg></div>
    <div class="label">ขอดูตัวอย่าง</div>
    <div class="hint">ลองเป็นลูกค้าร้านตัวอย่าง</div>
  </div>

  <div class="tile" data-tile="start">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M8 12h8M12.5 8.5L16 12l-3.5 3.5"/>
    </svg></div>
    <div class="label">เริ่มยังไง</div>
    <div class="hint">ขั้นตอนและนัดคุย</div>
  </div>

  <div class="tile" data-tile="handoff">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.5 11.5a8 8 0 0 1-11.6 7.2L3.5 20l1.3-5.1A8 8 0 1 1 20.5 11.5z"/>
    </svg></div>
    <div class="label">คุยกับมอส</div>
    <div class="hint">ส่งเรื่องถึงมอส</div>
  </div>

  <div class="tile accent" data-tile="call-lay">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/><path d="M12 3v2"/>
    </svg></div>
    <div class="label">เรียก Lay</div>
    <div class="hint">ให้ Lay กลับมาดูแล</div>
  </div>

</div>
</body>
</html>
