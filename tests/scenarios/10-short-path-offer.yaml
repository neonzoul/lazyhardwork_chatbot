name: short path · อาการ → fit answer → offer card (A2 T1)
covers: ["§3.4 fit by symptom", "§3.6 short path offer card", "§9.2 buttons not prose", "§9.5 banned content"]
# Needs deps.pack in the runner (ladders + fastworkUrls) for the offer card to render as Flex — see doc/flows.md "Runner".
user: { id: Utest-short, displayName: "พี่เอ" }
steps:
  - follow: true
    expect:
      replies: 1
      quick_replies: ["ทำอะไรได้บ้าง", "เหมาะกับงานผมไหม", "ขอดูตัวอย่าง"]
      sender: lay
  - postback: FIT_chat_overload
    model:
      messages:
        - { type: text, text: "เหมาะครับ ร้านที่ตอบแชทไม่ทันส่วนใหญ่เจอเหมือนกัน คือคำถามเดิมซ้ำทั้งวัน แล้วคนที่ตอบคือคนที่กำลังทำงานหน้าร้านอยู่", explain: false, template: null, alt: null, data: null }
        - { type: card, text: null, explain: false, template: offer, alt: "แพ็กเริ่มต้น AI Chatbot",
            data: { card_id: A2, tier: T1, title: "AI Chatbot", bullets: ["ตอบคำถามที่ลูกค้าถามซ้ำได้เองตลอดวัน", "ส่งต่อให้คนเมื่อเรื่องเกินขอบเขต", "ปรับคำตอบจากข้อมูลของร้านคุณ"], secondary_cta: { label: "นัดคุยกับมอสก่อน", postback: BOOK_START } } }
      quick_replies: ["ราคาเท่าไหร่", "เริ่มยังไง"]
      topics: [fit]
      kb_refs: ["fit.chat-overload", "offer.A2.T1"]
      intent: fit
      lead_updates: { business: null, problem_verbatim: "ตอบแชทลูกค้าไม่ทัน", where_work_lives: null, team_size: null, maintainer: null, urgency: null, budget_frame: null, preferred_contact: null, came_from: null, symptom: null, card: null, name: null }
      action: null
    expect:
      replies_min: 2
      card: offer
      text_contains: ["เหมาะครับ"]
      text_not_contains: ["ยืนยันแล้ว", "Sprint"]
      sender: lay
      banned_clean: true
      emoji_max: 0
      no_prose_list: true
      action: null
      session: { draft_has: [symptom, card, tier], homework_has: [problem_verbatim], mode: lay }
  - user: "เหมาะกับงานผมไหม"
    model:
      messages:
        - { type: text, text: "จากที่เล่ามา เรื่องตอบแชทไม่ทันคือจุดที่ช่วยได้ตรงที่สุดครับ แพ็ก AI Chatbot เริ่มต้นได้เลย", explain: false, template: null, alt: null, data: null }
      quick_replies: ["ราคาเท่าไหร่", "เริ่มยังไง"]
      topics: [fit]
      kb_refs: ["fit.chat-overload"]
      intent: fit
      lead_updates: { business: null, problem_verbatim: null, where_work_lives: null, team_size: null, maintainer: null, urgency: null, budget_frame: null, preferred_contact: null, came_from: null, symptom: null, card: null, name: null }
      action: null
    expect:
      replies_min: 1
      card: null
      text_not_contains: ["งานของคุณเป็นแบบไหนครับ"]   # the symptom is never asked again
      banned_clean: true
      session: { draft_has: [symptom, card] }
