<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Lay v2 Rich Menu — demo</title>
<link rel="stylesheet" href="richmenu.css">
</head>
<body>
<div class="menu">

  <div class="tile accent" data-tile="call-lay">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.5 12H5"/><path d="M10.5 6.5L5 12l5.5 5.5"/>
    </svg></div>
    <div class="label">กลับไปคุยกับ Lay</div>
    <div class="hint">ออกจากร้านตัวอย่าง</div>
  </div>

  <div class="tile" data-tile="shop-menu">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
    </svg></div>
    <div class="label">ดูเมนู/บริการ</div>
    <div class="hint">เมนูและราคาของร้าน</div>
  </div>

  <div class="tile" data-tile="shop-order">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 4h2.5l2.2 11h10.6l1.7-7H6.3"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/>
    </svg></div>
    <div class="label">สั่ง/จองเลย</div>
    <div class="hint">ลองสั่งหรือจองคิว</div>
  </div>

  <div class="tile" data-tile="demo-pick">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 9l4-5h8l4 5"/><path d="M4 9v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9"/><path d="M4 9h16"/><path d="M10 21v-6h4v6"/>
    </svg></div>
    <div class="label">เปลี่ยนร้านตัวอย่าง</div>
    <div class="hint">ร้านกาแฟ หรือ คลินิก</div>
  </div>

  <div class="tile" data-tile="handoff">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.5 11.5a8 8 0 0 1-11.6 7.2L3.5 20l1.3-5.1A8 8 0 1 1 20.5 11.5z"/>
    </svg></div>
    <div class="label">คุยกับมอส</div>
    <div class="hint">ส่งเรื่องถึงมอส</div>
  </div>

  <div class="tile" data-tile="start">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M8 12h8M12.5 8.5L16 12l-3.5 3.5"/>
    </svg></div>
    <div class="label">เริ่มยังไง</div>
    <div class="hint">ขั้นตอนและนัดคุย</div>
  </div>

</div>
</body>
</html>
