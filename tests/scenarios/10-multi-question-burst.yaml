name: 10 · ถามรวดเดียว 3 เรื่อง — topics union ทั้งสาม ปุ่มถัดไปไม่ซ้ำเรื่องที่ตอบแล้ว
covers: ["§9.1", "§9.2", "§9.6", "§3.3 union", "H3.2", "H2.2"]
user: { id: U10, displayName: "คุณฟ้า" }
steps:
  - user: "ราคาเท่าไหร่ ทำเสร็จกี่วัน เหมาะกับร้านกาแฟไหม"
    model:
      messages:
        - { type: text, text: "ตอบทีละข้อครับ ร้านกาแฟเหมาะมาก เพราะคำถามซ้ำเยอะและคนตอบคือคนหน้าร้าน\nแชทบอท LINE OA ราคาเริ่มต้น 15,000 บาท ราคาที่เห็นคือราคาเริ่มต้น ปรับตามขอบเขตจริงหลังคุย", explain: false, template: null, alt: null, data: null }
        - { type: text, text: "ส่วนเวลา แพ็กเริ่มต้นประมาณ 1 ถึง 2 สัปดาห์หลังได้ข้อมูลร้านครบครับ", explain: false, template: null, alt: null, data: null }
      quick_replies: ["ราคาเท่าไหร่", "ขอดูตัวอย่าง", "เริ่มยังไง"]     # the model slipped a covered topic in; the code drops it
      topics: [pricing, timeline, fit]
      kb_refs: ["offer.A2.T1", "process.timelines", "fit.chat-overload"]
      intent: pricing
      lead_updates: { business: "ร้านกาแฟ" }
    expect:
      replies_min: 1
      text_contains: ["ราคาเริ่มต้น", "สัปดาห์", "ร้านกาแฟ"]
      quick_replies: ["ขอดูตัวอย่าง", "เริ่มยังไง"]
      quick_replies_max: 4
      sender: lay
      banned_clean: true
      emoji_max: 0
      no_prose_list: true
      action: null
      session: { topics_covered_includes: [pricing, timeline, fit], homework_has: [business], questions_asked_max: 0 }
  - user: "ขอดูตัวอย่าง"          # code-owned: the examples carousel, no model call
    expect:
      replies: 2
      card: examples
      text_not_contains: ["181", "36 ราย"]
      sender: lay
      banned_clean: true
      emoji_max: 0
      session: { topics_covered_includes: [pricing, timeline, fit, proof] }
