name: 81 · homestay wants ChatGPT to recommend it — GEO stance, no guarantee, no internal-system pitch (GPT review scenario 4)
covers: ["§9.2", "GPT review 23 Oct #4", "D-38"]
# Source: GPT review adopted by Head GTM 23 Oct (review-gpt-website-and-lay-scenarios-2026-10-23.md, "5 scenario ทดสอบใน LINE OA").
# Scripted replies keep `npm run scenarios` deterministic; the acceptance check is `--model real --only "<n> ·"` scored 0–2 × 5.
# Pass when: says clearly what level of work we take (GEO is not a service yet, D-38); asks about the existing channels;
# separates what can be controlled from what cannot be guaranteed; never wraps an internal-system service around a
# marketing ask.
user: { id: U81, displayName: "โฮมสเตย์" }
steps:
  - follow: true
    expect: { replies: 1, sender: lay }
  - user: "ทำโฮมสเตย์อยู่ครับ อยากให้เวลาคนถาม ChatGPT ว่าที่พักเงียบ ๆ แถวพัทลุง แล้วมีชื่อที่พักผมขึ้นมา คุณรับทำไหมครับ?"
    model: { messages: [{ type: text, text: "เรื่องทำให้ร้านถูกค้นเจอหรือถูกแนะนำใน AI ตอนนี้ LazyHardWork ยังไม่ได้เปิดเป็นบริการครับ กำลังเตรียมอยู่", explain: false, template: null, alt: null, data: null }], quick_replies: [], topics: [capability], kb_refs: [], intent: out_of_scope }
    expect: { replies_min: 1, sender: lay, banned_clean: true, text_contains: ["ยังไม่ได้เปิดเป็นบริการ"], text_not_contains: ["ไม่ใช่งานที่ LazyHardWork รับ", "ระบบงานภายใน", "แชทบอท", "รับประกัน"] }
  - user: "ยังไม่มีเว็บ ต้องทำเว็บก่อนหรือเปล่า?"
    model: { messages: [{ type: text, text: "ยังไม่จำเป็นครับ เริ่มจากทำข้อมูลที่พักให้ตรงกันทุกช่องทางก่อนได้", explain: false, template: null, alt: null, data: null }], quick_replies: [], topics: [capability], kb_refs: [], intent: faq }
    expect: { replies_min: 1, sender: lay, banned_clean: true, text_not_contains: ["ระบบงานภายใน"] }
  - user: "คุณช่วยทำให้เลย หรือให้แผนแล้วผมต้องไปทำเอง?"
    model: { messages: [{ type: text, text: "ตอนนี้เรายังไม่ได้เปิดเป็นบริการครับ ถ้าอยากให้แจ้งตอนเปิด ผมจดไว้ให้ได้", explain: false, template: null, alt: null, data: null }], quick_replies: [], topics: [capability], kb_refs: [], intent: out_of_scope }
    expect: { replies_min: 1, sender: lay, banned_clean: true, text_not_contains: ["ระบบงานภายใน", "รับทำให้ครบ"] }
  - user: "จ่ายแล้วรับประกันได้ไหมว่าจะถูกแนะนำ ภายในสามเดือน?"
    model: { messages: [{ type: text, text: "รับประกันไม่ได้ครับ การที่ AI จะแนะนำใครขึ้นกับระบบของ AI เอง", explain: false, template: null, alt: null, data: null }], quick_replies: [], topics: [capability], kb_refs: [], intent: faq }
    expect: { replies_min: 1, sender: lay, banned_clean: true, text_not_contains: ["รับประกันได้", "ภายในสามเดือนแน่", "การันตี"] }
  - user: "Business Review 4,900 จะได้อะไรที่เกี่ยวกับเรื่องนี้ครับ?"
    model: { messages: [{ type: text, text: "AI Business Review ดูงานภายในของธุรกิจครับ ไม่ได้ครอบเรื่องให้ AI แนะนำที่พัก", explain: false, template: null, alt: null, data: null }], quick_replies: [], topics: [pricing], kb_refs: ["offer.C1"], intent: faq }
    expect: { replies_min: 1, sender: lay, banned_clean: true, text_not_contains: ["รับประกัน"] }
